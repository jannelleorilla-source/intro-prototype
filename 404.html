<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>INTRO</title>
<script>
// Tap addresses on the Studio host: /t/<code> and /p/<pcode> open the Studio app, which decides what to show.
// Base path: "" on studio.intro.ph, "/intro-prototype" on the GitHub Pages test host.
var BASE=/github\.io$/.test(location.hostname)?'/'+(location.pathname.split('/')[1]||''):'';
(function(){var m=location.pathname.match(/\/(t|p)\/([^\/?#]+)\/?$/);if(m){location.replace(BASE+'/?'+m[1]+'='+encodeURIComponent(m[2]).toUpperCase());}})();
</script>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#F4EFE8;color:#121212;font-family:Montserrat,Helvetica,Arial,sans-serif;text-align:center;padding:24px}a{color:inherit}</style></head>
<body><div><p style="letter-spacing:.42em;font-weight:300">INTRO</p><p style="margin-top:18px">Nothing here. <a id="home" href="/">Open INTRO Studio</a>.</p></div>
<script>document.getElementById('home').href=BASE+'/';</script></body></html>
