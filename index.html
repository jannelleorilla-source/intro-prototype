<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#121212">
<meta name="robots" content="noindex">
<link rel="icon" href="brand/favicon.svg" type="image/svg+xml">
<style>html{color-scheme:light dark}body{margin:0}</style>
<title>INTRO Studio</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Inter:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
/* Layout: three surfaces of one product — the tap view (what a recipient sees), card-first activation, and INTRO Studio (left rail, working column, live phone preview). Chrome follows the approved INTRO brand: Warm Ivory ground, Obsidian type, Graphite secondary, Champagne Bronze used sparingly; Jost for display and tracked labels, Inter for UI. */
:root{
  --ground:#F4EFE8; --surface:#FAF7F2; --fg:#121212; --fg-2:#625B53; --fg-3:#766E65; --rule:#DDD5CA; --chip:#EBE4DA; --chip-2:#DDD5CA;
  --bronze:#B48A5A; --rubric:#A3423A; --good:#3B6B45; --warn:#8A6A2E; --info:#4B5256;
  --serif:"Montserrat","Helvetica Neue",Arial,sans-serif;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 12px 32px rgba(40,30,15,.10);
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ground:#121212; --surface:#1A1917; --fg:#F4EFE8; --fg-2:#C9C1B7; --fg-3:#8C847B; --rule:#2A2826; --chip:#1C1B1A; --chip-2:#2A2826;
  --bronze:#C9A070; --rubric:#E07A70; --good:#8CC494; --warn:#D9B36A; --info:#A8B0B4; color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#121212; --surface:#1A1917; --fg:#F4EFE8; --fg-2:#C9C1B7; --fg-3:#8C847B; --rule:#2A2826; --chip:#1C1B1A; --chip-2:#2A2826;
  --bronze:#C9A070; --rubric:#E07A70; --good:#8CC494; --warn:#D9B36A; --info:#A8B0B4; color-scheme:dark}

*{box-sizing:border-box}
html{height:100%}body{min-height:100%}
body{margin:0;background:var(--ground);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration-thickness:1px;text-underline-offset:3px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
h1,h2,h3{font-family:var(--serif);font-weight:400;line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:clamp(30px,4.4vw,42px);letter-spacing:-.02em}
h2{font-size:26px}
h3{font-size:21px;font-weight:500}
p{margin:0}
.wmk{display:inline-flex;align-items:center;line-height:0}
.wmimg{height:13px;width:auto;display:none} .wmimg.l{display:inline}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .wmimg.l{display:none} :root:not([data-theme="light"]) .wmimg.d{display:inline}}
:root[data-theme="dark"] .wmimg.l{display:none} :root[data-theme="dark"] .wmimg.d{display:inline}
.proto .wmimg.l{display:none!important} .proto .wmimg.d{display:inline!important} .proto .wmimg{height:14px}
.rail .who .wmimg{height:16px}
.pp .wmimg{height:10px} .pp .wmimg.l{display:inline!important} .pp .wmimg.d{display:none!important} .pp.ink .wmimg.l{display:none!important} .pp.ink .wmimg.d{display:inline!important}
.wm{font-family:var(--serif);font-weight:300;letter-spacing:.34em;line-height:1;text-transform:uppercase;display:inline-flex;align-items:center;white-space:nowrap}
.wm .o{width:.78em;height:.78em;margin-left:.02em;flex:none}
.wm .o circle{fill:none;stroke:currentColor;stroke-width:1.9;stroke-dasharray:50 6.5;stroke-dashoffset:-4;stroke-linecap:butt}
.lbl{font-family:var(--serif);font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--fg-2);font-weight:500}
.muted{color:var(--fg-2)}
.small{font-size:14px;line-height:1.5}
.say{font-family:var(--serif);font-style:italic}
.say b{font-weight:500}
.stack>*+*{margin-top:12px}
.main .stack,.flow .stack{grid-template-columns:minmax(0,1fr)}
.laypick,.themepick,.sw,.seg{min-width:0;max-width:100%}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.grow{flex:1 1 auto;min-width:0}
.hide{display:none!important}
.tnum{font-variant-numeric:tabular-nums}
code,.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.92em;background:var(--chip);padding:1px 6px;border-radius:5px}

/* top bar: obsidian, numbered step pills, ivory wordmark (owner mockups 2026-10-19) */
.proto{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:#121212;color:#F4EFE8;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.proto .in{max-width:1360px;margin:0 auto;display:flex;align-items:center;gap:10px 18px;min-height:56px;flex-wrap:wrap;padding-block:10px}
.proto .wmimg{height:16px} .proto .wmimg.l{display:none!important} .proto .wmimg.d{display:inline!important}
.proto nav{display:flex;gap:0;align-items:center;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.proto nav a{text-decoration:none;font-size:14.5px;padding:7px 14px 7px 7px;border-radius:999px;color:#F4EFE8;opacity:.85;display:inline-flex;align-items:center;gap:9px;white-space:nowrap;font-weight:500;transition:background .15s,color .15s}
.proto nav a i{font-style:normal;font-family:var(--sans);font-size:12px;font-weight:700;width:24px;height:24px;border-radius:50%;border:1px solid rgba(244,239,232,.55);display:inline-grid;place-items:center;flex:none}
.proto nav a.on{background:#F4EFE8;color:#121212;opacity:1;font-weight:700} .proto nav a.on i{background:#121212;color:#F4EFE8;border-color:#121212}
.proto nav a+a::before{content:"";display:inline-block;width:18px;height:1px;background:rgba(244,239,232,.35);margin:0 4px 0 2px}
.proto nav a[target]{opacity:.5;font-size:13px} .proto nav a[target]::before{display:none}
.proto .tapcon{margin-left:auto;font-family:var(--serif);font-size:11.5px;letter-spacing:.26em;text-transform:uppercase;opacity:.8}
.proto .note{display:none}
.proto #themeBtn,.proto .reset{background:transparent;border:1px solid rgba(244,239,232,.4);color:#F4EFE8;border-radius:999px;padding:7px 14px;font-size:13.5px;font-weight:600}
.proto .reset{opacity:.55;font-weight:500}
@media (max-width:900px){.proto nav{order:3;flex-basis:100%;padding:2px 0 4px}.proto .tapcon{display:none}.proto #themeBtn{margin-left:auto}}
.page{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1360px;margin:0 auto}

/* buttons, fields, pills */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 22px;border-radius:999px;border:1px solid var(--fg);background:var(--fg);color:var(--ground);font-weight:600;font-size:15px;letter-spacing:.01em;text-decoration:none;white-space:nowrap;transition:transform .12s,filter .12s,border-color .12s}
.btn:active{transform:scale(.97)}
.btn:hover{filter:brightness(1.15)}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--rule)}
.btn.ghost:hover{filter:none;border-color:var(--fg)}
.btn.quiet{background:transparent;color:var(--fg-2);border-color:transparent;padding:0 10px}
.btn.quiet:hover{color:var(--fg);filter:none}
.btn.danger{background:transparent;color:var(--rubric);border-color:var(--rule)}
.btn.sm{min-height:34px;padding:0 14px;font-size:13px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label{font-size:14.5px;font-weight:600}
.field .hint{font-size:13.5px;color:var(--fg-2);line-height:1.45}
.field .err{font-size:12.5px;color:var(--rubric)}
input:not([type]),input[type=text],input[type=email],input[type=url],input[type=tel],input[type=search],select,textarea{font:inherit;font-size:16px;width:100%;min-height:46px;padding:10px 14px;border:1px solid var(--rule);border-radius:12px;background:var(--surface);color:var(--fg);transition:border-color .15s,box-shadow .15s}
textarea{min-height:88px;resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--fg);box-shadow:0 0 0 3px color-mix(in srgb,var(--fg) 14%,transparent)}
input.bad{border-color:var(--rubric)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:14px 16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:14px}
.pill{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;border:1px solid var(--rule);background:var(--surface);white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--fg-3);display:inline-block}
.pill.live i{background:var(--good)} .pill.paused i{background:var(--warn)} .pill.lost i{background:var(--rubric)} .pill.draft i{background:var(--info)}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:18px;padding:24px}
.card.tight{padding:16px 18px}
.card h3{margin-bottom:4px}
.sect{border-top:1px solid var(--rule);padding-top:18px;margin-top:22px}
.toggle{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:15px}
.toggle input{appearance:none;width:38px;height:22px;border-radius:999px;background:var(--chip-2);position:relative;margin:0;border:1px solid var(--rule);flex:none;cursor:pointer}
.toggle input::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--surface);transition:transform .15s}
.toggle input:checked{background:var(--fg);border-color:var(--fg)}
.toggle input:checked::after{transform:translateX(16px);background:var(--ground)}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:9px;overflow:hidden;background:var(--surface);flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:9px 15px;font-size:14px;font-weight:500;color:var(--fg-2);transition:background .12s}
.seg button.on{background:var(--fg);color:var(--ground);font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--fg);color:var(--ground);padding:10px 16px;border-radius:10px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:all .2s;z-index:60;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.callout{border-left:2px solid var(--rubric);padding:4px 0 4px 16px;font-size:14px}
.callout.good{border-color:var(--good)} .callout.info{border-color:var(--info)} .callout.warn{border-color:var(--warn)}
.ol{margin:0;padding-left:1.3em} .ol li+li{margin-top:6px} .ol li::marker{font-family:var(--serif);font-style:italic;color:var(--rubric)}

/* ===== public page renderer (what a tapper sees). Colours come from the customer's chosen theme, never from the viewer's. ===== */
.phone{width:340px;max-width:100%;border-radius:40px;background:#121212;padding:11px;box-shadow:0 14px 40px rgba(40,30,15,.22);flex:none}
.phone .scr{border-radius:30px;overflow:hidden;background:var(--p-bg)}
.pp{background:var(--p-bg);color:var(--p-fg);font-family:var(--sans);font-size:14.5px;line-height:1.45;min-height:560px;display:flex;flex-direction:column;transition:background .3s,color .3s}
.pp .save,.pp .tiles a i,.pp .acts a i,.pp .links a{transition:background .3s,color .3s,border-color .3s}
.pp .bar{height:30px;display:flex;justify-content:space-between;align-items:center;padding:0 22px;font-size:12px;font-weight:700}
.pp .url{margin:0 14px;padding:6px 12px;border-radius:10px;background:var(--p-chip);font-size:11.5px;color:var(--p-fg2);text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pp .cover{height:120px;background:var(--p-chip);background-size:cover;background-position:center;margin-top:10px}
.pp .body{padding:22px 22px 18px;flex:1}
.pp .cover+.body{padding-top:0}
.pp .phead{display:flex;flex-direction:column;align-items:center;text-align:center}
.pp .av{width:84px;height:84px;border-radius:50%;background:var(--p-chip);display:grid;place-items:center;font-family:var(--serif);font-weight:300;font-size:28px;letter-spacing:.08em;color:var(--p-fg2);margin-bottom:14px;background-size:cover;background-position:center;border:3px solid var(--p-bg);overflow:hidden;box-shadow:0 0 0 1px var(--p-rule)}
.pp .cover+.body .av{margin-top:-42px}
.pp .av.sq{border-radius:16px}
.pp .hw{font-family:var(--serif);font-weight:400;font-size:28px;line-height:1.1;letter-spacing:.01em;overflow-wrap:anywhere}
.pp .hw.long{font-size:24px}
.pp .tag{margin-top:6px;font-family:var(--serif);font-size:11.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--p-fg2)}
.pp .sayl{margin-top:10px;display:flex;flex-wrap:wrap;justify-content:center;gap:3px 10px;align-items:baseline;font-size:13.5px;color:var(--p-fg2)}
.pp .sayl .k{font-family:var(--serif);font-size:10px;letter-spacing:.22em;text-transform:uppercase}
.pp .sayl .v{font-family:var(--serif);font-style:italic;font-size:15.5px;color:var(--p-fg)}
.pp .sayl .v b{font-weight:500}
.pp .sayl .n{font-weight:600;color:var(--p-fg)}
.pp .pro{font-size:12px}
.pp .def{margin-top:14px;padding-top:14px;border-top:1px solid var(--p-rule);display:flex;gap:10px;align-items:center;justify-content:center;text-align:center}
.pp .def b{display:block;font-weight:600}
.pp .def .logo{width:34px;height:34px;border-radius:8px;background:var(--p-chip) center/cover;flex:none}
.pp .bio{margin-top:10px;color:var(--p-fg2);font-size:13.5px;text-align:center}
.pp .save{margin-top:18px;display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;border-radius:var(--p-r);background:var(--p-acc);color:var(--p-accfg);font-weight:600;font-size:14.5px;letter-spacing:.02em;border:0;width:100%;padding:0 14px}
.pp .acts{margin-top:14px;display:flex;justify-content:center;gap:14px;flex-wrap:wrap}
.pp .acts a{display:flex;flex-direction:column;align-items:center;gap:6px;text-decoration:none;color:var(--p-fg);font-size:10.5px;font-weight:500;min-width:56px}
.pp .acts a i{width:52px;height:52px;border-radius:50%;border:1px solid var(--p-rule);background:var(--p-surf);display:grid;place-items:center}
.pp .acts a svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.pp .grid{margin-top:16px;display:grid;grid-template-columns:repeat(4,1fr);gap:14px 8px}
.pp .grid a{display:flex;flex-direction:column;align-items:center;gap:6px;text-decoration:none;color:var(--p-fg);font-size:10.5px;font-weight:500;text-align:center}
.pp .grid a i{width:54px;height:54px;border-radius:50%;background:var(--p-fg);color:var(--p-bg);display:grid;place-items:center;font-family:var(--serif);font-weight:500;font-size:19px;font-style:normal}
.pp .grid a svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.pp .gridlbl{margin-top:18px;text-align:center;font-family:var(--serif);font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--p-fg2)}
.pp .links{margin-top:14px;display:grid;gap:8px}
.pp .links a{min-height:50px;padding:0 16px;border:1px solid var(--p-rule);border-radius:var(--p-r);background:var(--p-surf);display:flex;justify-content:space-between;gap:12px;text-decoration:none;color:inherit;align-items:center;font-weight:500;font-size:14px}
.pp .links a span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pp .links a span:last-child{color:var(--p-fg2);flex:none;font-weight:400;font-size:16px}
.pp .links a i svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.pp .socials{margin-top:16px;display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.pp .socials a{font-family:var(--serif);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;padding:7px 12px;border-radius:999px;border:1px solid var(--p-rule);text-decoration:none;color:var(--p-fg)}
.pp .ft{display:flex;justify-content:space-between;align-items:baseline;padding:14px 22px 20px;font-size:11.5px;color:var(--p-fg2)}
.pp .ft .wm{font-size:12px;color:var(--p-fg)}
.pp .ft a{color:inherit}
.pp .state{padding:40px 24px;flex:1;display:flex;flex-direction:column;justify-content:center;gap:12px}
.pp .state .big{font-family:var(--serif);font-weight:300;font-size:30px;line-height:1.1}
.pp .state .dotmark{width:18px;height:18px;border-radius:50%;border:2px solid var(--p-fg);margin-bottom:8px;border-right-color:transparent}
.pp .state .btn{background:var(--p-fg);color:var(--p-bg);border-color:var(--p-fg);margin-top:8px}
.pp .state .btn.ghost{background:transparent;color:var(--p-fg);border-color:var(--p-rule)}
.pp .state .sub{color:var(--p-fg2);font-size:13.5px}
.pp .vsheet{margin:0 14px 14px;background:var(--p-chip);border-radius:14px;padding:14px 16px;font-size:13px}
.pp .vsheet dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:8px 0 0}
.pp .vsheet dt{color:var(--p-fg2)} .pp .vsheet dd{margin:0;overflow-wrap:anywhere}


/* layouts: cover + hero, icon tiles, tab bar, divider */
.pp .coverwrap{padding:10px 14px 0}
.pp .covercard{height:150px;border-radius:22px;background:var(--p-chip) center/cover}
.pp .covercard.ph{background:linear-gradient(135deg,#E9E0D1 0%,#CDBFA8 55%,#A89C90 100%)}
.pp.ink .covercard.ph{background:linear-gradient(135deg,#34302B,#1E1C19)}
.pp .lay-cover .av{margin-top:-54px;width:108px;height:108px;border:4px solid var(--p-bg);box-shadow:none}
.pp .divider{width:34px;height:2px;background:var(--p-acc);margin:12px auto 10px;border-radius:2px}
.pp .hero{position:relative;min-height:400px;display:flex;flex-direction:column;justify-content:flex-end;padding:22px 22px 20px;background:#26231F center/cover;color:#F6F1E8;text-align:center}
.pp .hero.ph{background:linear-gradient(165deg,#4A443D 0%,#2A2723 55%,#161513 100%)}
.pp .hero::before{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(18,18,18,0) 28%,rgba(18,18,18,.55) 62%,#121212 100%)}
.pp .hero>*{position:relative}
.pp .hero .hw{font-size:30px}
.pp .hero .tag,.pp .hero .bio{color:#D8CFC2}
.pp .hero .bio{margin-top:0}
.pp .hero .sayl{color:#D8CFC2}.pp .hero .sayl .v,.pp .hero .sayl .n{color:#F6F1E8}
.pp .hero .ph-note{position:absolute;top:14px;left:0;right:0;text-align:center;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:#A89C90;font-family:var(--serif)}
.pp .tiles{margin-top:18px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px 8px;padding:0 2px}
.pp .tiles a{display:flex;flex-direction:column;align-items:center;gap:8px;text-decoration:none;color:var(--p-fg);font-size:11px;font-weight:500;text-align:center;min-width:0}
.pp .tiles a span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pp .tiles a i{width:66px;height:66px;border-radius:20px;background:var(--p-tile);color:var(--p-tilefg);display:grid;place-items:center;font-family:var(--serif);font-weight:500;font-size:24px;font-style:normal;letter-spacing:0;box-shadow:0 8px 18px rgba(20,14,6,.14)}
.pp .tiles a svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.pp .tabbar{display:flex;justify-content:space-around;align-items:center;border-top:1px solid var(--p-rule);padding:10px 8px 4px;background:var(--p-bg);margin-top:auto}
.pp .tabbar button{border:0;background:transparent;color:var(--p-fg);display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;font-weight:500;padding:4px 8px;font-family:var(--sans)}
.pp .tabbar svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.pp .tabbar .mini{width:28px;height:28px;border-radius:50%;background:var(--p-chip) center/cover;display:grid;place-items:center;font-size:10px;font-family:var(--serif);color:var(--p-fg2)}
.pp .ft{padding:4px 22px 14px;font-size:10.5px}
.pp .body{padding-top:18px}

<script>
/* day / night / auto switch for the Studio and Console chrome (customer pages keep their own theme) */
(function(){const K='intro-ui-theme';const modes=['auto','light','dark'];const label={auto:'Auto',light:'Day',dark:'Night'};
  const hostTheme=document.documentElement.getAttribute('data-theme'); /* what the viewer/app set before we touched it */
  function apply(m){const r=document.documentElement;if(m==='auto'){if(hostTheme)r.setAttribute('data-theme',hostTheme);else r.removeAttribute('data-theme')}else r.setAttribute('data-theme',m);const b=document.getElementById('themeBtn');if(b)b.textContent=(m==='dark'?'☾ ':m==='light'?'☀ ':'◐ ')+label[m]}
  let m='auto';try{m=localStorage.getItem(K)||'auto'}catch{}
  apply(m);
  document.addEventListener('click',e=>{const b=e.target.closest('#themeBtn');if(!b)return;m=modes[(modes.indexOf(m)+1)%modes.length];try{localStorage.setItem(K,m)}catch{}apply(m)});
  document.addEventListener('DOMContentLoaded',()=>apply(m));
})();

const TAP=(()=>{try{const q=new URLSearchParams(location.search);const t=(q.get('t')||'').toUpperCase(),p=(q.get('p')||'').toUpperCase();if(!q.has('t')&&!q.has('p'))return null;history.replaceState(null,'',location.pathname+location.hash);const ok=c=>/^[0-9A-HJKMNP-TV-Z]{8}$/.test(c);return {t:ok(t)?t:'',p:ok(p)?p:'',bad:(q.has('t')&&!ok(t))||(q.has('p')&&!ok(p))}}catch{return null}})();

function contrast(a,b){const l1=lum(a),l2=lum(b);return (Math.max(l1,l2)+.05)/(Math.min(l1,l2)+.05)}

/* ---------- vCard ---------- */
function vcard(c,o={}){
  const parts=(c.name||'').trim().split(/\s+/);const last=parts.length>1?parts.pop():'';const first=parts.join(' ');
  const v=c.vcard||{};
  const L=['BEGIN:VCARD','VERSION:3.0',`N:${last};${first};;;`,`FN:${c.name||''}`];
  if(v.nickname!==false&&c.goesBy)L.push(`NICKNAME:${c.goesBy}`);
  if(v.org!==false){if(c.org)L.push(`ORG:${c.org}`);if(c.role)L.push(`TITLE:${c.role}`)}
  const ct=c.contact||{};
  if(ct.mobile)L.push(`TEL;TYPE=CELL,VOICE:${ct.mobile}`);
  if(ct.viber&&ct.viber!==ct.mobile)L.push(`TEL;TYPE=CELL:${ct.viber}`);
  if(ct.email)L.push(`EMAIL;TYPE=INTERNET,PREF:${ct.email}`);
  let n=1;
  L.push(`item${n}.URL:https://${RESOLVER}/p/${S.profile.pcode}`);L.push(`item${n}.X-ABLabel:INTRO`);n++;
  const LK=(c.links||[]).filter(l=>l.on&&linkHref(l));
  if(v.links!==false&&!o.compact){for(const l of LK.filter(l=>!SOCIALS[l.kind])){L.push(`item${n}.URL:${linkHref(l)}`);L.push(`item${n}.X-ABLabel:${linkTitle(l)}`);n++}}
  if(v.socials!==false&&!o.compact){for(const l of LK.filter(l=>SOCIALS[l.kind])){L.push(`X-SOCIALPROFILE;type=${l.kind};x-user=${(l.value||'').replace(/^@/,'')}:${linkHref(l)}`)}
    if(ct.messenger)L.push(`IMPP;X-SERVICE-TYPE=Messenger:${'https://m.me/'+ct.messenger}`);
    if(ct.whatsapp)L.push(`IMPP;X-SERVICE-TYPE=WhatsApp:${'https://wa.me/'+digits(ct.whatsapp).replace('+','')}`);
    if(ct.telegram)L.push(`IMPP;X-SERVICE-TYPE=Telegram:${'https://t.me/'+ct.telegram}`)}
  if(c.location)L.push(`ADR;TYPE=WORK:;;;${c.location};;;`);
  if(v.photo!==false&&c.photo&&!o.compact){const b64=c.photo.split(',')[1]||'';L.push(o.preview?`PHOTO;ENCODING=b;TYPE=JPEG:(embedded photo, ${Math.round(b64.length*3/4/1024)} KB)`:'PHOTO;ENCODING=b;TYPE=JPEG:'+b64)}
  L.push('END:VCARD');return L.join('\r\n');
}
function vcfName(c){return ((c.name||'contact').replace(/[^\w\- ]+/g,'').trim()||'contact')+'.vcf'}

function setupToContent(s){const c=clone(DEMO_CONTENT);const [role,org]=(s.role||'').split(/\s*[·|,]\s*/);Object.assign(c,{name:s.name,headword:'',say:'',goesBy:'',role:role||'',org:org||'',location:'',bio:'',photo:s.photo||'',logo:'',cover:'covers/art/aurora-violet.svg',links:Object.entries(s.socials||{}).filter(([k,v])=>SOCIALS[k]&&(v||'').trim()).map(([k,v])=>({id:'s-'+k,kind:k,value:v.trim().replace(/^@/,''),on:true}))});c.appearance=Object.assign({},c.appearance,{layout:'cover',theme:PALETTES[s.theme]?s.theme:'ivory',accent:(PALETTES[s.theme]||PALETTES.ivory).acc});c.contact={mobile:s.mobile,email:'',messenger:'',viber:'',whatsapp:'',telegram:''};c.actionOrder=['call','sms'];return c}

</div></div>`}

function statusPill(){const st=S.profile.status;const dirty=isDirty();if(st==='hidden')return `<span class="pill paused"><i></i>Hidden</span>`;return `<span class="pill live"><i></i>Live</span>${dirty?' <span class="pill draft"><i></i>Unpublished changes</span>':''}`}

/* ---- introductions (metrics + game) ---- */
function barChart(buckets,key,title){const max=Math.max(1,...buckets.map(b=>b[key]));const W=560,H=150,pad={l:8,r:8,t:18,b:26};const bw=(W-pad.l-pad.r)/buckets.length;const iMax=buckets.findIndex(b=>b[key]===max);
  const bars=buckets.map((b,i)=>{const h=Math.round((H-pad.t-pad.b)*b[key]/max);const x=pad.l+i*bw+bw*0.3;const y=H-pad.b-h;const w=bw*0.4;const last=i===buckets.length-1;return `<g class="bar" data-tip="${b.label}: ${b[key]}"><rect x="${x.toFixed(1)}" y="${y}" width="${w.toFixed(1)}" height="${Math.max(h,0)}" rx="3" fill="${last?'var(--fg)':'var(--fg-3)'}"/>${(last||i===iMax)&&b[key]?`<text x="${(x+w/2).toFixed(1)}" y="${y-5}" text-anchor="middle" font-size="11" fill="var(--fg)">${b[key]}</text>`:''}<text x="${(x+w/2).toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="10" fill="var(--fg-3)">${i%2===buckets.length%2?b.label:''}</text><rect x="${(pad.l+i*bw).toFixed(1)}" y="${pad.t}" width="${bw.toFixed(1)}" height="${H-pad.t-pad.b}" fill="transparent"/></g>`}).join('');
  const grid=[0.5,1].map(f=>`<line x1="${pad.l}" x2="${W-pad.r}" y1="${(H-pad.b-(H-pad.t-pad.b)*f).toFixed(1)}" y2="${(H-pad.b-(H-pad.t-pad.b)*f).toFixed(1)}" stroke="var(--rule)" stroke-dasharray="2 4"/>`).join('');
  return `<div class="chart"><div class="row between" style="margin-bottom:6px"><span class="small" style="font-weight:600">${title}</span><span class="small muted">last 6 weeks</span></div><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${title}, weekly">${grid}<line x1="${pad.l}" x2="${W-pad.r}" y1="${H-pad.b}" y2="${H-pad.b}" stroke="var(--rule)"/>${bars}</svg><div class="tip" hidden></div></div>`}
function studioIntros(){const all=mTotals();const lv=levelFor(all.saves);const wk=weekBuckets(6);const thisW=wk[5],lastW=wk[4];const delta=(k)=>{const d=thisW[k]-lastW[k];return d===0?'<span class="muted">same as last week</span>':`<span style="color:${d>0?'var(--good)':'var(--fg-2)'}">${d>0?'+':''}${d} vs last week</span>`};
  const st=streak();const goal=S.metrics.goal||5;const gp=Math.min(100,Math.round(thisW.saves/goal*100));const badges=badgeList();const earned=badges.filter(b=>b.ok).length;const first=firstName(S.profile.published);
  const ring=(pct)=>{const r=44,c=2*Math.PI*r;return `<svg viewBox="0 0 100 100" class="ring" aria-hidden="true"><circle cx="50" cy="50" r="${r}" fill="none" stroke="var(--chip-2)" stroke-width="7"/><circle cx="50" cy="50" r="${r}" fill="none" stroke="var(--fg)" stroke-width="7" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${(c*(1-pct/100)).toFixed(1)}" transform="rotate(-90 50 50)"/><text x="50" y="55" text-anchor="middle" font-size="22" font-family="var(--serif)" fill="var(--fg)">${lv.i+1}</text></svg>`};
  return `<div class="head"><div><p class="lbl">Introductions</p><h1>${all.saves} people saved ${esc(first)}.</h1><p>Every tap is an introduction. Counts only; INTRO never records who tapped.</p></div></div>
  <div class="grid3">
    <div class="card lvl"><div class="row" style="gap:18px;align-items:center">${ring(lv.pct)}<div><p class="lbl">Level ${lv.i+1}</p><h3 style="margin-top:2px">${lv.name}</h3><p class="small muted" style="margin-top:4px">${lv.next?`${lv.next-all.saves} more saved contact${lv.next-all.saves===1?'':'s'} to <b>${lv.nextName}</b>`:'Top level. Nobody forgets you.'}</p></div></div></div>
    <div class="card"><h3>This week</h3><p class="small muted" style="margin:2px 0 8px">Goal: ${goal} introductions a week</p><div class="goalbar"><i style="width:${gp}%"></i></div><p class="small" style="margin-top:8px"><b>${thisW.saves} of ${goal}</b> saved ${thisW.saves>=goal?'· goal met':''}</p><div class="seg" style="margin-top:10px">${[3,5,10,20].map(g=>`<button type="button" data-goal="${g}" class="${goal===g?'on':''}">${g}</button>`).join('')}</div></div>
    <div class="card"><h3>Streak</h3><p class="stat" style="margin-top:6px"><b class="tnum">${st}</b><span>day${st===1?'':'s'} in a row with a tap</span></p><p class="small muted" style="margin-top:8px">${st>=7?'A full week. Keep the card in reach.':st>0?`${7-st} more for the “Full week” badge.`:'Tap your own card today to start one.'}</p></div>
  </div>
  <div class="grid2" style="margin-top:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr))">
    <div class="card tight"><p class="lbl">Taps</p><p class="stat"><b class="tnum">${thisW.taps}</b><span>${delta('taps')}</span></p></div>
    <div class="card tight"><p class="lbl">Contacts saved</p><p class="stat"><b class="tnum">${thisW.saves}</b><span>${delta('saves')}</span></p></div>
    <div class="card tight"><p class="lbl">Links opened</p><p class="stat"><b class="tnum">${thisW.links}</b><span>${delta('links')}</span></p></div>
    <div class="card tight"><p class="lbl">Shares</p><p class="stat"><b class="tnum">${thisW.shares}</b><span>${delta('shares')}</span></p></div>
  </div>
  <div class="grid2" style="margin-top:14px"><div class="card">${barChart(wk,'saves','Contacts saved')}</div><div class="card">${barChart(wk,'taps','Taps and scans')}</div></div>
  <div class="card" style="margin-top:14px"><div class="row between"><h3>Badges</h3><span class="small muted tnum">${earned} of ${badges.length}</span></div>
    <div class="badges">${badges.map(b=>`<div class="badge ${b.ok?'ok':''}"><i>${b.ok?'✓':''}</i><div><b>${b.name}</b><span class="small muted">${b.how}${b.ok&&S.metrics.badges[b.id]?' · '+fmtDate(S.metrics.badges[b.id]):''}</span></div></div>`).join('')}</div></div>
  <p class="small muted" style="margin-top:14px;max-width:640px">All time: ${all.taps} taps, ${all.saves} contacts saved, ${all.links} links opened, ${all.shares} shares. In this prototype your own visits to the Tap view and presses on “Save to contacts” count too.</p>`}

/* ====================== behaviour ====================== */
function changeCount(){const a=S.profile.draft,b=S.profile.published;let n=0;for(const k of new Set([...Object.keys(a),...Object.keys(b)])){if(JSON.stringify(a[k])!==JSON.stringify(b[k]))n++}return n}
function refreshPreview(){const pv=$('#pv');if(pv)pv.innerHTML=renderProfile(S.profile.draft,{pcode:S.profile.pcode});const s=$('#savest');if(s){const n=changeCount();s.innerHTML=`<i class="dot ${n?'warn':''}"></i>`+(n?`${n} change${n===1?'':'s'} saved as draft · not published yet`:'Everything published')}$$('[data-publish],[data-discard]').forEach(b=>{if(b.closest('.savebar'))b.disabled=!isDirty()})}
function bindInputs(root){
  $$('[data-bind]',root).forEach(el=>{const v=get(S.profile.draft,el.dataset.bind);if(el.tagName!=='TEXTAREA')el.value=v??'';
    el.addEventListener('input',()=>{set(S.profile.draft,el.dataset.bind,el.value);const err=$(`[data-err="${el.dataset.bind}"]`);if(err&&el.type==='url'){const m=el.value?validUrl(el.value):'';err.textContent=m;el.classList.toggle('bad',!!m)}const m2=el.dataset.bind.match(/^links\.(\d+)\.value$/);if(m2){const l=S.profile.draft.links[+m2[1]];const pv=$(`[data-lkprev="${m2[1]}"]`);if(pv&&l)pv.textContent=linkHref(l)||((LINK_KINDS[l.kind]?.hint||'')+'…')}save();refreshPreview()})});
  $$('[data-bindchk]',root).forEach(el=>{el.checked=!!get(S.profile.draft,el.dataset.bindchk);el.addEventListener('change',()=>{set(S.profile.draft,el.dataset.bindchk,el.checked);save();refreshPreview()})});
  $$('[data-img]',root).forEach(el=>el.addEventListener('change',()=>{const f=el.files[0];if(!f)return;if(f.size>5*1024*1024){toast('That image is over 5 MB');return}const img=new Image();const r=new FileReader();r.onload=()=>{img.onload=()=>{const max=el.dataset.img==='cover'?1800:el.dataset.img==='logo'?256:480;const sc=Math.min(1,max/Math.max(img.width,img.height));const cv=document.createElement('canvas');cv.width=Math.round(img.width*sc);cv.height=Math.round(img.height*sc);cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);S.profile.draft[el.dataset.img]=cv.toDataURL('image/jpeg',el.dataset.img==='cover'?.78:.82);if(el.dataset.img==='cover')S.profile.draft.coverPos={x:50,y:50};save();retab()};img.src=r.result};r.readAsDataURL(f)}));
  const ad=$('#addact',root);if(ad)ad.addEventListener('change',()=>{if(ad.value&&S.profile.draft.actionOrder.length<6){S.profile.draft.actionOrder.push(ad.value);save();retab()}});
  const acc=$('#accpick',root);if(acc)acc.addEventListener('input',()=>{S.profile.draft.appearance.accent=acc.value;save();refreshPreview()});
  if(acc)acc.addEventListener('change',()=>retab());
  $$('input[data-s]',root).forEach(el=>el.addEventListener('input',()=>{A.setup[el.dataset.s]=el.value}));$$('input[data-soc-v]',root).forEach(el=>el.addEventListener('input',()=>{A.setup.socials[el.dataset.socV]=el.value}));
  ['c0','c1','c2'].forEach((id,i)=>{const el=$('#'+id,root);if(!el)return;el.addEventListener('input',()=>{el.value=el.value.replace(/\D/g,'').slice(0,5);A.code[i]=el.value;if(el.value.length===5&&i<2)$('#c'+(i+1)).focus()})});
  const em=$('#em',root);if(em)em.addEventListener('input',()=>A.email=em.value);
  const otp=$('#otp',root);if(otp)otp.addEventListener('input',()=>{otp.value=otp.value.replace(/\D/g,'').slice(0,8);A.otp=otp.value});
}
function retab(){const tb=$('#tabbody');if(!tb)return;const open=$$('details.more',tb).map(x=>x.open);const y=window.scrollY;tb.innerHTML=editorBody(S.profile.draft);$$('details.more',tb).forEach((x,i)=>x.open=!!open[i]);bindInputs(tb);watchSections();window.scrollTo(0,y);refreshPreview()}
function afterRender(h){bindInputs($('#app'));watchSections();const f=$('#c0')||$('#em')||$('#otp');if(f&&!f.value)f.focus()}

    $('#layer').innerHTML=`<div class="sheetm" data-pvclose><div class="in"><div class="row between"><h3>Add a link</h3><button class="btn sm quiet" type="button" data-pvclose>Close</button></div><p class="small muted" style="margin-top:4px">Pick what you want to add. You’ll enter the username or address next.</p>${grp('social','Social profiles')}${grp('web','Web and business')}</div></div>`;return}

let secIO=null;function watchSections(){if(secIO)secIO.disconnect();const secs=$$('.esec[data-sec]');if(!secs.length)return;secs.forEach(x=>{if(secState[x.dataset.sec])x.classList.add('closed')});secIO=new IntersectionObserver(es=>{const vis=es.filter(x=>x.isIntersecting).sort((a,b)=>a.boundingClientRect.top-b.boundingClientRect.top);if(!vis.length)return;const id=vis[0].target.dataset.sec;$$('[data-secnav]').forEach(a=>a.classList.toggle('on',a.dataset.secnav===id));secs.forEach(x=>x.classList.toggle('active',x.dataset.sec===id))},{rootMargin:'-120px 0px -55% 0px',threshold:[0,.2]});secs.forEach(x=>secIO.observe(x))}
