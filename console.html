<style>
/* Layout: the internal Console. Dense, operational, same brand tokens as Studio but with tables, state chips and a left rail. Print sheets are separate views with their own @media print rules. */
:root{
  --ground:#F4EFE8; --surface:#FAF7F2; --fg:#121212; --fg-2:#625B53; --fg-3:#766E65; --rule:#DDD5CA; --chip:#EBE4DA; --chip-2:#DDD5CA;

  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; --shadow:0 1px 2px rgba(0,0,0,.06),0 12px 32px rgba(40,30,15,.10);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ground:#121212;--surface:#1A1917;--fg:#F4EFE8;--fg-2:#C9C1B7;--fg-3:#8C847B;--rule:#2A2826;--chip:#1C1B1A;--chip-2:#2A2826;--bronze:#C9A070;--bad:#E07A70;--good:#8CC494;--warn:#D9B36A;--info:#8FB3E0;color-scheme:dark}}
:root[data-theme="dark"]{--ground:#121212;--surface:#1A1917;--fg:#F4EFE8;--fg-2:#C9C1B7;--fg-3:#8C847B;--rule:#2A2826;--chip:#1C1B1A;--chip-2:#2A2826;--bronze:#C9A070;--bad:#E07A70;--good:#8CC494;--warn:#D9B36A;--info:#8FB3E0;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration-thickness:1px;text-underline-offset:3px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
h1,h2,h3{font-family:var(--serif);font-weight:400;line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:clamp(28px,4vw,38px)} h2{font-size:24px} h3{font-size:19px;font-weight:500}
p{margin:0}
.wmk{display:inline-flex;align-items:center;line-height:0}

:root[data-theme="dark"] .wmimg.l{display:none} :root[data-theme="dark"] .wmimg.d{display:inline}

.wrap{max-width:1500px;margin:0 auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--fg);background:var(--fg);color:var(--ground);font-weight:600;font-size:14px;text-decoration:none;white-space:nowrap}

.pill.released i{background:var(--bronze)} .pill.active i{background:var(--good)} .pill.paused i{background:var(--warn)} .pill.lost i{background:var(--bad)} .pill.blocked i{background:var(--bad)} .pill.retired i{background:var(--fg-3)}
.pill.new i{background:var(--info)} .pill.production i{background:var(--warn)} .pill.ready i{background:var(--bronze)} .pill.shipped i{background:var(--good)}

.console{display:grid;grid-template-columns:210px minmax(0,1fr);min-height:calc(100vh - 44px)}

.main{padding:24px clamp(16px,2.5vw,36px) 90px;min-width:0}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px} .head p{color:var(--fg-2);margin-top:4px}

/* quick setup */
.inbox{background:var(--chip);border:1px solid var(--rule);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.5;overflow-wrap:anywhere} .inbox .code{white-space:normal;overflow-wrap:anywhere} .inbox b{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--fg-3);margin-bottom:4px}

.qchip i{width:22px;height:22px;border-radius:7px;background:var(--b)} .qchip:hover{border-color:var(--fg)} .qchip.on{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}
.qrows{display:grid;gap:8px;margin-top:12px} .qrow{display:grid;grid-template-columns:30px minmax(0,1fr) 32px;gap:10px;align-items:center} .qrow i{width:30px;height:30px;border-radius:9px;display:block}
.qrow .x{width:32px;height:32px;border-radius:999px;border:0;background:transparent;color:var(--fg);opacity:.55;font-size:20px;line-height:1;cursor:pointer} .qrow .x:hover{opacity:1}
.tdots{display:flex;gap:10px;flex-wrap:wrap} .tdots button{width:36px;height:36px;border-radius:50%;border:1px solid var(--rule);padding:0;position:relative;box-shadow:0 0 0 2px var(--surface);cursor:pointer} .tdots button i{position:absolute;right:6px;bottom:6px;width:12px;height:12px;border-radius:50%} .tdots button.on{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--fg)}
.qav{width:56px;height:56px;border-radius:50%;background:var(--chip) center/cover no-repeat;display:grid;place-items:center;font-family:var(--serif);font-size:18px;color:var(--fg-2);flex:none}
.filebtn{position:relative;cursor:pointer}
.switch{display:flex;gap:14px;align-items:flex-start;cursor:pointer} .switch input{position:absolute;opacity:0;width:0;height:0} .switch .track{width:44px;height:26px;border-radius:999px;background:var(--chip-2);position:relative;flex:none;transition:background .15s;margin-top:2px} .switch .track i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .15s} .switch input:checked+.track{background:var(--good)} .switch input:checked+.track i{left:21px} .switch input:focus-visible+.track{outline:2px solid var(--fg);outline-offset:2px}
.card.flat{border:0;padding:0;background:transparent} .card.flat h3{font-size:15px}
.qrbox svg{width:120px;height:120px;display:block}

.shipsteps b{font-size:14.5px}
.callout{border-left:2px solid var(--bad);padding:4px 0 4px 14px;font-size:13px} .callout.good{border-color:var(--good)} .callout.info{border-color:var(--info)} .callout.warn{border-color:var(--warn)}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--fg);color:var(--ground);padding:10px 16px;border-radius:10px;font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:all .2s;z-index:60;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px}

.canary{display:flex;gap:6px;flex-wrap:wrap} .canary span{font-size:11px;padding:3px 8px;border-radius:6px;background:var(--chip);display:inline-flex;gap:6px;align-items:center} .canary i{width:7px;height:7px;border-radius:50%;background:var(--good);display:inline-block}

<script>
/* day / night / auto switch for the Studio and Console chrome (customer pages keep their own theme) */
(function(){const K='intro-ui-theme';const modes=['auto','light','dark'];const label={auto:'Auto',light:'Day',dark:'Night'};
  const hostTheme=document.documentElement.getAttribute('data-theme'); /* what the viewer/app set before we touched it */
  function apply(m){const r=document.documentElement;if(m==='auto'){if(hostTheme)r.setAttribute('data-theme',hostTheme);else r.removeAttribute('data-theme')}else r.setAttribute('data-theme',m);const b=document.getElementById('themeBtn');if(b)b.textContent=(m==='dark'?'☾ ':m==='light'?'☀ ':'◐ ')+label[m]}
  let m='auto';try{m=localStorage.getItem(K)||'auto'}catch{}
  apply(m);
  document.addEventListener('click',e=>{const b=e.target.closest('#themeBtn');if(!b)return;m=modes[(modes.indexOf(m)+1)%modes.length];try{localStorage.setItem(K,m)}catch{}apply(m)});
  document.addEventListener('DOMContentLoaded',()=>apply(m));
})();

/* ---------- utilities ---------- */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const RESOLVER='intro.ph'; // placeholder host; /t/<code> matches the website and print templates
const PUBLIC_BASE=()=>location.origin+location.pathname.replace(/console(\.html)?\/?$/,'');
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2400)}
const now=()=>new Date().toISOString();
function fmt(iso){if(!iso)return '—';const d=new Date(iso);return d.toLocaleString('en-PH',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}
function fmtD(iso){if(!iso)return '—';return new Date(iso).toLocaleDateString('en-PH',{day:'numeric',month:'short',year:'numeric'})}
function ago(iso){if(!iso)return 'never';const h=(Date.now()-new Date(iso))/36e5;if(h<1)return 'just now';if(h<24)return Math.round(h)+' h ago';const d=Math.round(h/24);return d===1?'yesterday':d+' days ago'}
function mask(e){if(!e||!e.includes('@'))return esc(e||'');const [u,d]=e.split('@');return esc((u[0]||'')+'•••@'+d)}
const validEmail=e=>/^[^@\s<>]+@[^@\s<>]+\.[^@\s<>]+$/.test(e||'');
function qrSvg(text,cell){try{const q=qrcode(0,'M');q.addData(text);q.make();return q.createSvgTag({cellSize:cell||3,margin:4,scalable:true})}catch{return ''}}
async function sha256(s){const b=new TextEncoder().encode(s);const h=await crypto.subtle.digest('SHA-256',b);return [...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('')}

/* ---------- codes: device code (Crockford base32 + Luhn mod-32 check), setup code (14 digits + Damm check) ---------- */
const CROCK='0123456789ABCDEFGHJKMNPQRSTVWXYZ';
function luhn32(s){let f=2,sum=0;for(let i=s.length-1;i>=0;i--){let a=CROCK.indexOf(s[i])*f;f=f===2?1:2;a=Math.floor(a/32)+(a%32);sum+=a}return CROCK[(32-(sum%32))%32]}
function newDeviceCode(){const a=crypto.getRandomValues(new Uint8Array(7));let s='';for(const b of a)s+=CROCK[b%32];return s+luhn32(s)}
function deviceCodeValid(c){c=(c||'').toUpperCase().replace(/[^0-9A-Z]/g,'').replace(/O/g,'0').replace(/[IL]/g,'1');if(c.length!==8)return false;return luhn32(c.slice(0,7))===c[7]}
const DAMM=[[0,3,1,7,5,9,8,6,4,2],[7,0,9,2,1,5,4,8,6,3],[4,2,0,6,8,7,1,3,5,9],[1,7,5,0,9,8,3,4,2,6],[6,1,2,3,0,4,5,9,7,8],[3,6,7,4,2,0,9,5,8,1],[5,8,6,9,7,2,0,1,3,4],[8,9,4,5,3,6,2,0,1,7],[9,4,3,8,6,1,7,2,0,5],[2,5,8,1,4,3,6,7,9,0]];
function damm(digits){let i=0;for(const d of digits)i=DAMM[i][+d];return i}
function newSetupCode(){const a=crypto.getRandomValues(new Uint8Array(14));let s='';for(const b of a)s+=b%10;return s+damm(s)}
const setupValid=c=>/^\d{15}$/.test(c)&&damm(c)===0;

function vOrder(id){const o=order(id);if(!o)return '<p>Order not found.</p>';const devs=S.devices.filter(d=>d.orderId===o.id);const b=o.batch?batch(o.batch):null;const canP=can('production');

  const steps=[
    {t:'Allocate codes',d:'One device code, one setup code and one QR per unit.',ok:!!b,act:!b&&canP?`<button class="btn sm" data-allocate="${o.id}">Allocate ${o.lines.reduce((a,l)=>a+l.qty,0)} devices</button>`:b?`<a class="small" href="#batch-${b.id}">Batch ${b.id}</a>`:''},

    {t:'Encode and lock',d:'Write the chip URL, read it back, lock.',ok:!!allLocked,act:b&&!allLocked?`<a class="btn sm ghost" href="#batch-${b.id}">Open batch</a>`:''},

    :allPacked&&canP?`<div class="grid2"><div class="field"><label for="sh-c">Courier</label><select id="sh-c"><option>LBC</option><option>J&T Express</option><option>Lalamove</option><option>Grab Express</option><option>Pickup</option></select></div><div class="field"><label for="sh-t">Tracking number <span class="muted" style="font-weight:400">(optional)</span></label><input id="sh-t" placeholder="e.g. 1234 5678 9012"></div></div><div class="row" style="margin-top:12px"><button class="btn" data-ship="${o.id}">Mark shipped</button><a class="btn ghost" href="#print-slip-${o.id}">Packing slip</a></div>`

  <div class="grid3">
    <div class="card" style="grid-column:1/-1"><h3>Lines</h3><div class="tbl" style="margin-top:10px"><table><thead><tr><th>Product</th><th class="num">Qty</th><th>Personalisation brief</th></tr></thead><tbody>${o.lines.map(l=>`<tr><td>${SKUS[l.sku]||l.sku}</td><td class="num">${l.qty}</td><td>${esc(l.pers)}</td></tr>`).join('')}</tbody></table></div>${o.notes?`<p class="small muted" style="margin-top:10px">Notes: ${esc(o.notes)}</p>`:''}</div>
    ${o.quick?'':`<div class="card" style="grid-column:1/-1"><div class="row between"><div><h3>Set up their page for them</h3><p class="small muted" style="margin-top:2px">${o.prepared?`Prepared by ${esc(o.prepared.by)} · ${fmt(o.prepared.at)} · ${o.prepared.liveNow?'goes live before shipping':'live when they claim'}`:'Optional. Type their links and look now so the card arrives ready. They still claim it once with the setup code and their email.'}</p></div><button class="btn sm ${o.prepared?'ghost':''}" data-prep="${o.id}">${o.prepared?'Edit':'Set up their page'}</button></div></div>`}
    ${o.quick?`<div class="card" style="grid-column:1/-1"><h3>Quick setup</h3><p class="small muted" style="margin:2px 0 12px">Set up with the customer by ${esc(o.prepared?o.prepared.by:'staff')} · ${o.prepared?fmt(o.prepared.at):''} · ${o.prepared&&o.prepared.liveNow?'page live':'page hidden until they publish'}. No inserts, no setup code: they sign in with their email.</p>${devs.map(d=>`<div class="row between"><span>Card <a href="#device-${d.code}" class="code">${d.code}</a> · <span class="pill ${d.state}"><i></i>${STATE_LABEL[d.state]}</span></span><span class="row"><button class="btn sm" data-nfc="${d.code}">Write chip</button><a class="btn sm ghost" href="${PUBLIC_BASE()}#activate" target="_blank" rel="noopener">Open as the customer ↗</a></span></div>`).join('')}</div>`:`<div class="card" style="grid-column:1/-1"><h3>Prepare and ship <span class="small muted" style="font-weight:400">· bulk orders by courier</span></h3><p class="small muted" style="margin:2px 0 12px">Six steps, in order. Nothing ships until every card has been matched to its insert. Customers in front of you don’t need this: use <a href="#quick">Quick setup</a>.</p>
      <ol class="shipsteps">${steps.map((st,i)=>`<li class="${st.ok?'ok':''}"><span class="n">${st.ok?'✓':i+1}</span><div class="grow"><b>${st.t}</b><p class="small muted">${st.d}</p></div><div>${st.act}</div></li>`).join('')}</ol>

  return `<div class="printbar"><a class="btn ghost sm" href="#batch-${b.id}">Back to batch</a><button class="btn sm" data-print>Print</button><span class="small muted">Fold-and-seal inserts. One per box, matched at pack-verify. Codes shown once.</span></div>
    <div class="sheet"><h2>Insert sheet · ${b.id} · ${ds.length} inserts</h2><div class="insgrid">${ds.map(d=>`<div class="ins"><span class="t">Your INTRO setup code</span><span class="k">${fmtSetup(b.plain[d.code]||'···············')}</span><span class="d">1. Tap your new INTRO with your own phone, or scan the QR on its back.<br>2. Choose “I own this INTRO. Set it up.”<br>3. Enter this code, then your email.<br>Keep this insert until you have activated. Never share the code.</span><span class="f"><span class="wmk"><img class="wmimg l" src="brand/wordmark-obsidian.png" alt="INTRO"><img class="wmimg d" src="brand/wordmark-ivory.png" alt=""></span><span>${SKUS[d.sku]} · ${d.code}</span></span></div>`).join('')}</div></div>`;
}

/* ---------- devices ---------- */
let devFilter={q:'',state:''};
function vDevices(){
  const list=S.devices.filter(d=>(!devFilter.state||d.state===devFilter.state)&&(!devFilter.q||d.code.includes(devFilter.q.toUpperCase())||(d.orderId||'').includes(devFilter.q)));
  return `<div class="head"><div><p class="lbl">Devices</p><h1>Every INTRO, by code</h1><p>Universal lookup. Type a device code from a card, a QR, a support message or a tap log.</p></div></div>
  <div class="row" style="margin-bottom:12px"><input type="search" id="dq" placeholder="Device code or order, e.g. 7KQ4M2XD" value="${esc(devFilter.q)}" style="max-width:320px"><select id="ds" style="max-width:220px"><option value="">All states</option>${STATES.map(s=>`<option value="${s}" ${devFilter.state===s?'selected':''}>${STATE_LABEL[s]}</option>`).join('')}</select><span class="small muted tnum">${list.length} of ${S.devices.length}</span></div>
  <div class="tbl"><table><thead><tr><th>Code</th><th>Product</th><th>State</th><th>Opens</th><th>Owner</th><th>Order</th><th>Last tap</th></tr></thead><tbody>${list.map(d=>`<tr class="clk" data-go="#device-${d.code}"><td><a href="#device-${d.code}" class="code">${d.code}</a>${d.canary?' <span class="pill"><i></i>canary</span>':''}</td><td>${SKUS[d.sku]}</td><td><span class="pill ${d.state}"><i></i>${STATE_LABEL[d.state]}</span></td><td>${d.mode==='direct'?'Direct link':'Profile'}</td><td>${d.owner?`<a href="#customer-${d.owner}">${esc(cust(d.owner)?.name||d.owner)}</a>`:'<span class="muted">—</span>'}</td><td>${d.orderId}</td><td class="tnum">${ago(d.lastTap)}</td></tr>`).join('')}</tbody></table></div>`;
}
function vDevice(code){const d=dev(code);if(!d)return `<p>No device <span class="code">${esc(code)}</span>. ${deviceCodeValid(code)?'Valid check digit, but never allocated.':'Check digit fails: a typo, or not an INTRO code.'}</p>`;
  const o=cust(d.owner);const sup=can('support'),prod=can('production');
  return `<div class="head"><div><p class="lbl"><a href="#devices">Devices</a> · ${d.code}</p><h1>${SKUS[d.sku]} <span class="code" style="font-size:.6em;vertical-align:middle">${d.code}</span></h1><p>Order <a href="#order-${d.orderId}">${d.orderId}</a> · batch <a href="#batch-${d.batch}">${d.batch}</a> · chip and QR <span class="code">https://${RESOLVER}/t/${d.code}</span></p></div><span class="pill ${d.state}"><i></i>${STATE_LABEL[d.state]}</span></div>
  <div class="grid3">
    <div class="card"><h3>What a tap does now</h3><p class="small" style="margin-top:6px">${tapOutcome(d)}</p><p class="small muted" style="margin-top:8px">Last tapped ${ago(d.lastTap)}. Tap events keep only time, outcome and coarse device class.</p></div>
    <div class="card"><h3>Owner</h3>${o?`<p class="small"><a href="#customer-${o.id}">${esc(o.name)}</a> · ${mask(o.loginEmail)}<br>Profile <span class="code">/p/${o.pcode}</span> · ${o.profileStatus}</p>`:'<p class="small muted">Unclaimed. The first person to tap it and present the setup code becomes the owner.</p>'}<p class="small muted" style="margin-top:8px">Setup code: stored as hash only · rotated ${d.rotations}×</p></div>
    <div class="card"><h3>Actions</h3><div class="row" style="margin-top:8px">
      ${sup?`<button class="btn sm ghost" data-dev="rotate:${d.code}" ${['retired','blocked'].includes(d.state)?'disabled':''}>Rotate setup code</button>`:''}
      ${sup&&d.owner?`<button class="btn sm ghost" data-dev="resetclaim:${d.code}">Reset claim</button>`:''}
      ${sup&&d.state!=='blocked'&&d.state!=='retired'?`<button class="btn sm danger" data-dev="block:${d.code}">Block</button>`:''}
      ${sup&&d.state==='blocked'?`<button class="btn sm ghost" data-dev="unblock:${d.code}">Unblock</button>`:''}
      ${(sup||prod)&&d.state!=='retired'?`<button class="btn sm danger" data-dev="retire:${d.code}">Retire</button>`:''}
      ${!sup&&!prod?'<span class="small muted">Read-only for your role.</span>':''}</div>
      <p class="small muted" style="margin-top:10px">Rotate: lost insert before activation. Reset claim: detaches the owner so a returned card can be re-sold; the profile is untouched. Block: abuse; the tap shows “not available”. Retire: destroyed or recalled hardware.</p></div>
    <div class="card" style="grid-column:1/-1"><h3>Verify a setup code</h3><p class="small muted" style="margin:4px 0 10px">What the activation server does: hash what the customer typed with this device’s code and compare. Never a lookup by code alone.</p><div class="row"><input id="vc" inputmode="numeric" placeholder="15 digits" style="max-width:260px"><button class="btn sm" data-verify="${d.code}">Check</button><span id="vres" class="small"></span></div></div>
    <div class="card" style="grid-column:1/-1"><h3>History</h3><div class="timeline" style="margin-top:8px">${[...d.events].reverse().map(([s,t])=>`<div><span class="t">${fmt(t)}</span><span><span class="pill ${s}"><i></i>${STATE_LABEL[s]||s}</span></span></div>`).join('')}</div></div>
  </div>`;
}
function tapOutcome(d){const o=cust(d.owner);
  switch(d.state){case 'active':return o&&o.suspended?'Profile suspended by staff → “This INTRO isn’t available right now.”':d.mode==='direct'?'Opens the owner’s stored Direct Link destination.':`Opens the published profile <span class="code">/p/${o?.pcode}</span>.`;
  case 'released':return 'Shows “This INTRO isn’t set up yet” with the activation start. Only the holder of the matching setup code can claim it.';
  case 'paused':return 'Owner paused it → “This INTRO is paused.”';case 'lost':return 'Owner reported it lost → finder page, no owner details.';case 'blocked':return 'Blocked by staff → “not available”.';case 'retired':return 'Retired → not found page.';default:return 'Not in the field yet. The chip URL resolves to a “not yet released” page so a leaked card cannot be activated.'}}

/* ---------- customers ---------- */
function vCustomers(){return `<div class="head"><div><p class="lbl">Customers</p><h1>Accounts</h1><p>Lookup by login email or device. Staff never edit profile content; they can lock sign-in, suspend a profile, or process deletion.</p></div></div>
  <div class="tbl"><table><thead><tr><th>Name</th><th>Login email</th><th>Profile</th><th>Devices</th><th>Flags</th><th>Since</th></tr></thead><tbody>${S.customers.map(c=>`<tr class="clk" data-go="#customer-${c.id}"><td><a href="#customer-${c.id}"><b>${esc(c.name)}</b></a></td><td>${mask(c.loginEmail)}</td><td><span class="code">/p/${c.pcode}</span> · ${c.suspended?'suspended':c.profileStatus}</td><td>${c.devices.length}</td><td>${c.locked?'<span class="pill lost"><i></i>sign-in locked</span>':''}${c.deletion?'<span class="pill paused"><i></i>deleting</span>':''}</td><td class="tnum">${fmtD(c.since)}</td></tr>`).join('')}</tbody></table></div>`}
function vCustomer(id){const c=cust(id);if(!c)return '<p>Not found.</p>';const sup=can('support');
  return `<div class="head"><div><p class="lbl"><a href="#customers">Customers</a></p><h1>${esc(c.name)}</h1><p>${mask(c.loginEmail)} · account since ${fmtD(c.since)} · profile <span class="code">/p/${c.pcode}</span> (${c.suspended?'suspended by staff':c.profileStatus})</p></div></div>
  <div class="grid3">
    <div class="card"><h3>Devices</h3><div class="stack" style="margin-top:8px">${c.devices.map(code=>{const d=dev(code);return d?`<a class="small" href="#device-${code}"><span class="code">${code}</span> ${SKUS[d.sku]} · <span class="pill ${d.state}"><i></i>${STATE_LABEL[d.state]}</span></a>`:''}).join('')}</div>${sup?`<button class="btn sm ghost" style="margin-top:12px" data-repl="${c.id}">Issue replacement card</button>`:''}<p class="small muted" style="margin-top:8px">A replacement is a new device allocated to the same account; the profile never changes.</p></div>
    <div class="card"><h3>Safety actions</h3><div class="row" style="margin-top:8px">${sup?`<button class="btn sm ghost" data-cust="${c.locked?'unlock':'lock'}:${c.id}">${c.locked?'Unlock sign-in':'Lock sign-in'}</button><button class="btn sm ghost" data-cust="${c.suspended?'unsuspend':'suspend'}:${c.id}">${c.suspended?'Lift suspension':'Suspend profile'}</button>${c.deletion?`<button class="btn sm ghost" data-cust="canceldel:${c.id}">Cancel deletion</button>`:`<button class="btn sm danger" data-cust="delete:${c.id}">Start deletion</button>`}`:'<span class="small muted">Support role needed.</span>'}</div><p class="small muted" style="margin-top:10px">${c.deletion?`Deletion scheduled for ${fmtD(c.deletion)} (14-day grace). Profile offline, cards show “not available”.`:'Lock sign-in: suspected account takeover. Suspend: policy violation; the public page shows “not available” while devices stay attached.'}</p></div>
    <div class="card"><h3>What staff cannot do</h3><p class="small muted" style="margin-top:6px">Read the private login email in full, edit the profile, see sign-in codes, or move a device to another account without a reset-claim recorded in the audit log. Assisted setup is a Phase 2 feature with customer consent.</p></div>
  </div>`;
}

function vReports(){const sup=can('support');return `<div class="head"><div><p class="lbl">Reports</p><h1>Abuse queue</h1><p>From the “Report” link on every public page. Phishing and impersonation first.</p></div></div>
  <div class="stack">${S.reports.map(r=>`<div class="card"><div class="row between"><div><b>${r.id}</b> · ${esc(r.reason)} · <span class="code">${esc(r.target)}</span> <span class="small muted">· ${fmt(r.at)}</span><p class="small" style="margin-top:6px">${esc(r.detail)}</p></div><span class="pill ${r.status}"><i></i>${r.status}</span></div>${r.status==='open'&&sup?`<div class="row" style="margin-top:12px"><button class="btn sm ghost" data-rep="dismiss:${r.id}">Dismiss</button><button class="btn sm ghost" data-rep="suspend:${r.id}">Suspend profile</button><button class="btn sm danger" data-rep="block:${r.id}">Block device</button></div>`:''}</div>`).join('')}</div>`}

/* ---------- codes & QR explainer ---------- */
function vCodes(){const dc=newDeviceCode(),sc=newSetupCode();
  return `<div class="head"><div><p class="lbl">Codes & QR</p><h1>How every INTRO is identified</h1><p>Three artefacts per device, all generated here. Customers never create or upload any of them.</p></div></div>
  <div class="grid3">
    <div class="card"><h3>1 · Device code</h3><p class="small" style="margin-top:6px">8 characters, Crockford base32 (no I, L, O, U so it can be read aloud) with a Luhn mod-32 check character. Lives in the chip URL and the QR: <span class="code">https://${RESOLVER}/t/${dc}</span>. Public, not secret.</p><p class="codes" style="margin-top:10px">${dc}</p><p class="small muted">Fresh example each visit. Typing <span class="code">${dc.slice(0,7)}X</span> fails the check: <b>${deviceCodeValid(dc.slice(0,7)+'X')?'valid':'invalid'}</b>.</p></div>
    <div class="card"><h3>2 · Setup code</h3><p class="small" style="margin-top:6px">15 digits: 14 random + a Damm check digit, so a typo is caught before it reaches the server. Generated per device at allocation, printed once on that device’s insert, stored only as a bcrypt hash bound to the device code. No expiry. Five wrong tries pause the card for an hour.</p><p class="codes" style="margin-top:10px">${fmtSetup(sc)}</p><p class="small muted">Check digit valid: <b>${setupValid(sc)?'yes':'no'}</b>. Change one digit and it fails.</p></div>
    <div class="card"><h3>3 · QR code</h3><p class="small" style="margin-top:6px">Generated from the device code, error correction M, 18 mm with a 4-module quiet zone, printed on the card back. Points to the same <span class="code">/t/${dc}</span> address as the chip, so QR and tap can never disagree. The Profile QR and Offline Contact QR in Studio are generated too.</p><div style="background:#fff;padding:10px;border-radius:10px;width:fit-content;margin-top:10px">${qrSvg(`https://${RESOLVER}/t/${dc}`,3).replace('<svg','<svg style="width:96px;height:96px;display:block"')}</div></div>
    <div class="card" style="grid-column:1/-1"><h3>Why not one universal code</h3><p class="small" style="margin-top:6px">A universal or batch code means one leaked insert claims any card in the field. Per-device codes bound to the device hash limit a leak to one card, which can then be rotated. The cost is a production step: print each insert, match it to its card, and verify the match at pack time. That is the pack-verify step in every batch.</p></div>
  </div>`;
}

/* ---------- modal ---------- */
function modal(html){$('#layer').innerHTML=`<div class="modal" data-close><div class="in" role="dialog" aria-modal="true">${html}</div></div>`;setTimeout(()=>{($('#layer [data-focus]')||$('#layer input,#layer select'))?.focus()},0)}

/* ---------- actions ---------- */
async function allocate(oid){const o=order(oid);const n=o.lines.reduce((a,l)=>a+l.qty,0);const bid='B-'+String(S.seq.batch++).padStart(4,'0');const b={id:bid,orderId:oid,createdAt:now(),sealed:false,plain:{}};
  for(const l of o.lines)for(let i=0;i<l.qty;i++){let code;do{code=newDeviceCode()}while(dev(code));const sc=newSetupCode();b.plain[code]=sc;S.devices.push({code,sku:l.sku,state:'allocated',orderId:oid,batch:bid,setupHash:await setupHash(sc,code),rotations:0,owner:null,mode:DIRECT_SKUS.includes(l.sku)?'direct':'profile',lastTap:'',events:[['allocated',now()]]})}
  S.batches.push(b);o.batch=bid;o.status='in production';log('batch.allocate',bid,`${n} devices for ${oid}`);save();location.hash='#batch-'+bid;toast(`${n} devices allocated. Print the QR sheet and inserts.`)}
function refreshOrder(oid){const o=order(oid);if(!o||!o.batch)return;const ds=S.devices.filter(d=>d.batch===o.batch);if(o.status!=='shipped'){o.status=ds.every(d=>d.state==='packed'||d.state==='released')?'ready':'in production'}}

document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-si],[data-role],[data-signout],[data-go],[data-neworder],[data-qsoc],[data-qsocrm],[data-qtheme],[data-qsave],[data-qdemo],[data-qnew],[data-qphotorm],[data-prep],[data-prepsave],[data-allocate],[data-ship],[data-seal],[data-bulk],[data-dev],[data-print],[data-nfc],[data-nfcwrite],[data-copyurl],[data-verify],[data-cust],[data-repl],[data-rep],[data-addstaff],[data-close],[data-closebtn],[data-create]');
  if(!t)return;const ds=t.dataset;
  if(ds.role){A.role=ds.role;route();return}
  if(ds.si){if(ds.si==='code'){const em=$('#se').value.trim();if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){toast('Enter a valid work email');return}A.email=em;A.sent=String(Math.floor(1e7+Math.random()*9e7));A.step='code'}
    else if(ds.si==='back'){A.step='email'}
    else if(ds.si==='mfa'){if($('#sc').value!==A.sent){toast('Code doesn’t match');return}A.step='mfa'}
    else if(ds.si==='done'){if($('#sm').value!=='000000'){toast('Authenticator code doesn’t match');return}const st=S.staffList.find(x=>x.role===A.role)||S.staffList[0];S.staff={name:st.name,role:st.role,mfa:true,email:A.email};log('staff.signin',st.name,'email code + MFA');save();A.step='email';location.hash='#dash'}
    route();return}
  if(ds.signout!==undefined){log('staff.signout',S.staff.name,'');S.staff=null;save();location.hash='#signin';route();return}
  if(ds.go){location.hash=ds.go;return}
  if(ds.close!==undefined){if(e.target!==t)return;closeModal();return}
  if(ds.closebtn!==undefined){closeModal();return}
  if(ds.print!==undefined){try{window.print()}catch{}toast('If no print dialog opened, open the local file to print.');return}
  const PQ=()=>($('#layer .in')&&$('[data-prep="1"]',$('#layer .in'))&&PREP)?PREP:Q;
  if(ds.qsoc){const q=PQ();if(q.socials[ds.qsoc]===undefined){q.socials[ds.qsoc]='';rerenderPrep(`input[data-qv="${ds.qsoc}"]`)}else if(!q.socials[ds.qsoc].trim()){delete q.socials[ds.qsoc];rerenderPrep(`[data-qsoc="${ds.qsoc}"]`)}else{const el=$(`input[data-qv="${ds.qsoc}"]`);if(el)el.focus()}return}
  if(ds.qsocrm){const q=PQ();delete q.socials[ds.qsocrm];rerenderPrep(`[data-qsoc="${ds.qsocrm}"]`);return}
  if(ds.qtheme){PQ().theme=ds.qtheme;rerenderPrep(`[data-qtheme="${ds.qtheme}"]`);return}
  if(ds.qphotorm!==undefined){PQ().photo='';rerenderPrep();return}
  if(ds.qdemo!==undefined){Object.assign(Q,{name:'Marco Dela Cruz',role:'Realtor · Northpoint Realty',mobile:'+63 917 555 0199',email:'marco.dc@example.ph',channel:'Messenger',ref:'FB: Marco Dela Cruz',socials:{instagram:'marco.sells.dipolog',facebook:'marcodelacruzrealty',tiktok:'marco.sells'},theme:'electric'});route();return}
  if(ds.qsave!==undefined){quickSave();return}
  if(ds.qnew!==undefined){QDONE=null;Q=blankPrep();route();return}
  if(ds.prep){const o=order(ds.prep);PREP=Object.assign(blankPrep(),o.prepared||{},{liveNow:o.prepared?!!o.prepared.liveNow:false});if(!o.prepared){PREP.name=o.customer;PREP.email=o.email;PREP.channel=o.channel}modal(prepModal(o));return}
  if(ds.prepsave){const o=order(ds.prepsave);const d=S.devices.find(x=>x.orderId===o.id);o.prepared=savePrep(PREP,{orderId:o.id,code:d?d.code:''});log('order.prepare',o.id,`page prepared · ${PREP.liveNow?'live before shipping':'live on claim'}`);save();closeModal();route();toast('Saved. The card will arrive with this page ready.');return}
  if(ds.neworder!==undefined){modal(`<h2>New order</h2><p class="small muted" style="margin:4px 0 14px">Key in the external reference exactly. Prices come from the catalog; nothing is charged here.</p><div class="stack"><div class="grid2"><div class="field"><label>Channel</label><select id="n-ch">${CHANNELS.map(c=>`<option>${c}</option>`).join('')}</select></div><div class="field"><label>External ref</label><input id="n-ref" placeholder="#1044 / TT-…"></div></div><div class="grid2"><div class="field"><label>Customer</label><input id="n-cu" placeholder="Name or business"></div><div class="field"><label>Customer email</label><input id="n-em" type="email" placeholder="for the order only"></div></div><div class="grid2"><div class="field"><label>Product</label><select id="n-sku">${Object.entries(SKUS).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div><div class="field"><label>Quantity</label><input id="n-q" type="number" min="1" max="50" value="1"></div></div><div class="field"><label>Personalisation brief</label><textarea id="n-p" placeholder="Names, roles, colours, logo reference…"></textarea></div></div><div class="row" style="margin-top:16px"><button class="btn" data-create>Create order</button><button class="btn quiet" data-closebtn>Cancel</button></div>`);return}
  if(ds.create!==undefined){const cu=$('#n-cu').value.trim(),ref=$('#n-ref').value.trim(),em=$('#n-em').value.trim();if(!cu||!ref){toast('Customer and reference are required');return}if(em&&!validEmail(em)){toast('Enter a valid customer email');return}const id='INTRO-'+String(S.seq.order++).padStart(5,'0');S.orders.unshift({id,channel:$('#n-ch').value,ref,customer:cu,email:em,lines:[{sku:$('#n-sku').value,qty:Math.max(1,Math.min(50,+$('#n-q').value||1)),pers:$('#n-p').value.trim()}],status:'new',createdAt:now(),notes:''});log('order.create',id,`${$('#n-ch').value} ${ref}`);save();closeModal();location.hash='#order-'+id;toast('Order created');return}
  if(ds.allocate){if(!can('production'))return;await allocate(ds.allocate);return}
  if(ds.ship){const o=order(ds.ship);o.status='shipped';o.shippedAt=now();o.courier=$('#sh-c')?.value||'';o.tracking=($('#sh-t')?.value||'').trim();for(const d of S.devices.filter(x=>x.orderId===o.id&&x.state==='packed'))setState(d,'released','shipped with order');log('order.ship',o.id,`${o.courier} ${o.tracking}`);save();route();toast('Marked shipped. Devices are now unclaimed in the field.');return}
  if(ds.seal){const b=batch(ds.seal);modal(`<h2>Seal batch ${b.id}?</h2><p class="small" style="margin:8px 0 14px">Confirm the insert sheet is printed and matched. After sealing, the plain setup codes are purged and only hashes remain. A lost insert will need a code rotation.</p><div class="row"><button class="btn" data-dev="sealnow:${b.id}">Seal and purge codes</button><button class="btn quiet" data-closebtn>Not yet</button></div>`);return}
  if(ds.bulk){const [act,bid]=ds.bulk.split(':');const list=S.devices.filter(d=>d.batch===bid);let n=0;
    for(const d of list){if(act==='encode'&&d.state==='allocated'){setState(d,'encoded','Web NFC write');setState(d,'verified','read-back + resolve check OK');n++}if(act==='lock'&&d.state==='verified'){setState(d,'locked','permanent lock');n++}if(act==='release'&&d.state==='packed'){setState(d,'released','');n++}}
    refreshOrder(batch(bid).orderId);save();route();toast(`${n} device${n===1?'':'s'} updated`);return}
  if(ds.dev){const [act,code]=ds.dev.split(':');
    if(act==='invite'){const n=$('#st-n').value.trim(),em=$('#st-e').value.trim();if(!n||!validEmail(em)){toast('Name and a valid work email are needed');return}S.staffList.push({id:'s'+Date.now(),name:n,email:em,role:$('#st-r').value,mfa:false});log('staff.invite',n,$('#st-r').value);save();closeModal();route();toast('Invite sent. MFA enrolment required at first sign-in.');return}
    if(act==='sealnow'){const b=batch(code);b.sealed=true;b.plain={};log('batch.seal',b.id,'plain setup codes purged');save();closeModal();route();toast('Batch sealed');return}
    const d=dev(code);if(!d)return;
    if(act==='encode'){setState(d,'encoded','Web NFC write OK');setState(d,'verified','read-back matched; resolve check 200');toast('Written and read back. Resolve check passed.')}
    else if(act==='verify'){setState(d,'verified','resolve check 200')}
    else if(act==='lock'){setState(d,'locked','permanent lock set');toast('Chip locked. This cannot be undone.')}
    else if(act==='pack'){const b=batch(d.batch);modal(`<h2>Pack-verify ${d.code}</h2><p class="small" style="margin:8px 0 14px">Scan the card (done: <span class="code">${d.code}</span>). Now type the setup code printed on the insert you are putting in this box.</p><div class="field"><label>Setup code from insert</label><input id="pk" inputmode="numeric" placeholder="15 digits" data-focus>${b&&!b.sealed?`<p class="hint">Prototype hint, this batch is unsealed: ${fmtSetup(b.plain[d.code])}</p>`:'<p class="hint">Batch sealed: only the hash is known, exactly like production.</p>'}</div><div class="row" style="margin-top:14px"><button class="btn" data-dev="packcheck:${d.code}">Verify match</button><button class="btn quiet" data-closebtn>Cancel</button></div>`);return}
    else if(act==='packcheck'){const typed=$('#pk').value.replace(/\D/g,'');if(!setupValid(typed)){toast('Check digit fails: re-read the insert');return}const h=await setupHash(typed,d.code);if(h!==d.setupHash){log('device.packmismatch',d.code,'insert did not match card');save();toast('MISMATCH. Wrong insert for this card. Quarantined.');closeModal();return}setState(d,'packed','insert matched card');closeModal();toast('Match. Packed.')}
    else if(act==='release'){setState(d,'released','')}
    else if(act==='rotate'){const sc=newSetupCode();d.setupHash=await setupHash(sc,d.code);d.rotations++;log('device.rotate',d.code,'new setup code issued; old one void');save();modal(`<h2>New setup code for ${d.code}</h2><p class="small" style="margin:8px 0 12px">Shown once. Give it to the verified customer or print a new insert. The old code no longer works.</p><div class="secret codes">${fmtSetup(sc)}</div><div class="row" style="margin-top:14px"><button class="btn" data-closebtn>I have recorded it</button></div>`);route();return}
    else if(act==='resetclaim'){const c=cust(d.owner);if(c)c.devices=c.devices.filter(x=>x!==d.code);d.owner=null;d.mode='profile';setState(d,'released','claim reset by staff; profile untouched');toast('Claim reset. Device is unclaimed again.')}
    else if(act==='block'){setState(d,'blocked','staff block')}
    else if(act==='unblock'){setState(d,d.owner?'active':'released','unblocked')}
    else if(act==='retire'){setState(d,'retired','hardware retired')}
    refreshOrder(d.orderId);save();route();return}
  if(ds.verify){const d=dev(ds.verify);const typed=$('#vc').value.replace(/\D/g,'');const r=$('#vres');if(!setupValid(typed)){r.textContent='Check digit fails before any lookup.';r.style.color='var(--bad)';return}const h=await setupHash(typed,d.code);const ok=h===d.setupHash;r.textContent=ok?'Match: this code would claim this device.':'No match: wrong code for this device.';r.style.color=ok?'var(--good)':'var(--bad)';log('device.verifycode',d.code,ok?'match':'no match');save();return}
  if(ds.cust){const [act,id]=ds.cust.split(':');const c=cust(id);
    if(act==='lock'){c.locked=true}if(act==='unlock'){c.locked=false}if(act==='suspend'){c.suspended=true}if(act==='unsuspend'){c.suspended=false}
    if(act==='delete'){const dt=new Date();dt.setDate(dt.getDate()+14);c.deletion=dt.toISOString();c.suspended=true}if(act==='canceldel'){c.deletion=null;c.suspended=false}
    log('customer.'+act,c.id,'');save();route();toast('Done. Logged.');return}
  if(ds.repl){const c=cust(ds.repl);const id='INTRO-'+String(S.seq.order++).padStart(5,'0');S.orders.unshift({id,channel:'Direct',ref:'REPL-'+c.pcode,customer:c.name,email:c.loginEmail,lines:[{sku:'card',qty:1,pers:'Replacement for '+c.pcode+' · price per current list'}],status:'new',createdAt:now(),notes:'Replacement. Attaches to existing account '+c.id+' at claim.',replacementFor:c.id});log('order.replacement',id,'for '+c.id);save();location.hash='#order-'+id;toast('Replacement order created');return}
  if(ds.rep){const [act,id]=ds.rep.split(':');const r=S.reports.find(x=>x.id===id);r.status='closed';r.resolution=act;
    if(act!=='dismiss'){const code=r.target.split('/').pop();const d=dev(code);if(d){if(act==='block')setState(d,'blocked','report '+r.id);if(act==='suspend'&&d.owner){cust(d.owner).suspended=true}}}
    log('report.'+act,r.id,'');save();route();toast('Report closed: '+act);return}
  if(ds.nfc){const d=dev(ds.nfc);const prod=`https://${RESOLVER}/t/${d.code}`;const test=PUBLIC_BASE()+'#view';modal(`<h2>Write chip · ${d.code}</h2><p class="small muted" style="margin:6px 0 12px">Writes a URL record to an NTAG213 with this phone. Works in Chrome on Android (Web NFC). On iPhone use the NFC Tools app and paste the address. The chip is <b>not</b> locked here; locking happens only after read-back and QC.</p>
    <div class="field"><label>Production address (final domain)</label><input class="mono" value="${prod}" readonly></div><div class="field" style="margin-top:10px"><label>Test address (this prototype, full-screen customer view)</label><input class="mono" id="nfc-url" value="${esc(test)}"></div>
    <div class="row" style="margin-top:14px"><button class="btn" data-nfcwrite="${d.code}">Write test address with this phone</button><button class="btn ghost" data-copyurl="${esc(test)}">Copy</button><button class="btn quiet" data-closebtn>Close</button></div><p class="small" id="nfc-res" style="margin-top:10px"></p>`);return}
  if(ds.copyurl){navigator.clipboard?.writeText(ds.copyurl).then(()=>toast('Address copied')).catch(()=>toast(ds.copyurl));return}
  if(ds.nfcwrite){const url=$('#nfc-url').value.trim();const res=$('#nfc-res');if(!/^https:\/\//.test(url)){res.textContent='Use a full https:// address.';return}if(!('NDEFReader' in window)){res.textContent='This browser has no Web NFC. Open console.html in Chrome on an Android phone, or use the NFC Tools app on iPhone with the copied address.';return}try{res.textContent='Hold the card to the back of the phone…';const w=new NDEFReader();await w.write({records:[{recordType:'url',data:url}]});res.textContent='Written. Tap the card with another phone to test. Not locked.';log('device.encode.test',ds.nfcwrite,'Web NFC test write (unlocked): '+url);save()}catch(e){res.textContent='Write failed: '+(e&&e.message||e)}return}
  if(ds.addstaff!==undefined){modal(`<h2>Invite staff</h2><div class="stack" style="margin-top:12px"><div class="field"><label>Name</label><input id="st-n"></div><div class="field"><label>Work email</label><input id="st-e" type="email"></div><div class="field"><label>Role</label><select id="st-r">${Object.entries(ROLES).map(([k,r])=>`<option value="${k}">${r.name}</option>`).join('')}</select></div></div><div class="row" style="margin-top:14px"><button class="btn" data-dev="invite:_">Send invite</button><button class="btn quiet" data-closebtn>Cancel</button></div>`);
    return}
});
document.addEventListener('input',e=>{if(e.target.id==='dq'){devFilter.q=e.target.value;const tb=$('.tbl tbody');if(tb){$('#app').querySelector('.main').innerHTML=vDevices();$('#dq').focus();$('#dq').setSelectionRange(1e3,1e3)}}
  if(e.target.id==='aq'){auditQ=e.target.value;$('#app').querySelector('.main').innerHTML=vSystem();$('#aq').focus();$('#aq').setSelectionRange(1e3,1e3)}});
document.addEventListener('change',e=>{if(e.target.id==='ds'){devFilter.state=e.target.value;route()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
if(!location.hash)location.hash=S.staff?'#dash':'#signin';
ensureHashes().then(()=>{route()});
</script>

</body>
</html>
